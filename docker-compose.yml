services:
  # The single entry point clients call (8080): routes /api/v1/** and /media/** to the service that
  # owns each path. It validates nothing — every service is still a resource server.
  gateway:
    build:
      context: .
      dockerfile: bookland-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_URL: http://app:8083
      CATALOG_URL: http://catalog:8082
    restart: unless-stopped

  # The API: orders, payments, reviews, wishlist. Published on 8083 for its Swagger UI; clients go
  # through the gateway.
  app:
    build:
      context: .
      dockerfile: bookland-app/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/bookland
      # Its own role, owner of the bookland database only — never the superuser, which can read the
      # identity service's database too. Created by docker/postgres/initdb.
      DB_USER: ${APP_DB_USER:-bookland_app}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      # Tokens come from the identity service. The issuer is what the browser saw when it logged in,
      # so it is the address published on the host; the keys are fetched over the compose network.
      # The two differ on purpose, and swapping them only fails at validation time.
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-http://127.0.0.1:9000}
      OAUTH2_JWK_SET_URI: http://identity:9000/oauth2/jwks
      # Pre-fills the Swagger UI's Authorize dialog; the login itself runs on the identity service.
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-bookland-web}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Books are read from the catalog service over gRPC, inside the compose network. This
      # process serves gRPC on 9090 too (orders' OrderActivity, asked by the catalog); neither port
      # is published to the host.
      CATALOG_GRPC_ADDRESS: static://catalog:9090
    # No depends_on the identity service: this process boots and serves public reads without it. It
    # does need it to validate tokens, and not just once: the decoder caches the public keys for
    # 5 minutes (Nimbus's default) and then fetches them again. With the identity service down past
    # that, every authenticated request answers 500 INTERNAL_ERROR after ~5 s — measured in step 3c.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # The catalog service: books, categories, stock and its history, cover images. HTTP for clients,
  # gRPC (9090, not published) for the API, Kafka for the checkout saga and the ratings.
  catalog:
    build:
      context: .
      dockerfile: bookland-catalog-app/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Its own database and role (created by docker/postgres/initdb on the volume's first start).
      DB_URL: jdbc:postgresql://postgres:5432/catalog
      DB_USER: ${CATALOG_DB_USER:-catalog}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      # Same token setup as the API: the issuer as the browser saw it, the keys over the network.
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-http://127.0.0.1:9000}
      OAUTH2_JWK_SET_URI: http://identity:9000/oauth2/jwks
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-bookland-web}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_PORT: 9090
      # Asked before removing a book: does it have active orders?
      ORDERS_GRPC_ADDRESS: static://app:9090
      STORAGE_COVERS_LOCATION: /var/bookland/covers
    volumes:
      - bookland-covers:/var/bookland/covers
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # The identity service: users, login and the Authorization Server that signs every token.
  identity:
    build:
      context: .
      dockerfile: bookland-identity-app/Dockerfile
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Its own database and role (created by docker/postgres/initdb on the volume's first start).
      DB_URL: jdbc:postgresql://postgres:5432/identity
      DB_USER: ${IDENTITY_DB_USER:-identity}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      # Must be the URL clients actually reach the server on — it is published in the discovery
      # document and lands in the iss claim, and a mismatch only surfaces at validation time.
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-http://127.0.0.1:9000}
      # Base64 of the DER, single-line. The private half is the secret of the whole system:
      # whoever holds it mints admin tokens. Only this service has it.
      OAUTH2_JWK_PUBLIC_KEY: ${OAUTH2_JWK_PUBLIC_KEY}
      OAUTH2_JWK_PRIVATE_KEY: ${OAUTH2_JWK_PRIVATE_KEY}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-bookland-web}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_CLIENT_REDIRECT_URIS: ${OAUTH2_CLIENT_REDIRECT_URIS}
      # The Swagger UIs (API on 8083, catalog on 8082) exchange the code from their own origins.
      OAUTH2_CORS_ALLOWED_ORIGINS: ${OAUTH2_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8083,http://127.0.0.1:8082}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Single-node KRaft broker (no ZooKeeper): this one process is both broker and controller.
  # Same version as the Kafka client in Boot's BOM. No volume: topics and consumer offsets live in
  # the container, so they survive stop/start but not `docker compose down`.
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners, because a client must reach the broker at the address the broker
      # advertises: kafka:29092 inside the compose network, localhost:9092 for an app run from the host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # The internal topics default to 3 replicas, which a single broker cannot hold.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web UI for topics, messages and consumer-group offsets. Published on 8081: 8080 is the gateway.
  redpanda-console:
    image: redpandadata/console:v3.12.0
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bookland
      POSTGRES_USER: ${POSTGRES_USER:-bookland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookland}
      # Read by docker/postgres/initdb, which creates one role per service and the identity and
      # catalog databases.
      APP_DB_USER: ${APP_DB_USER:-bookland_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - bookland-pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is empty — after `docker compose down -v`.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookland} -d bookland"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bookland-pgdata:
  bookland-covers:

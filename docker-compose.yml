services:
  app:
    build:
      context: .
      dockerfile: bookland-app/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/bookland
      DB_USER: ${POSTGRES_USER:-bookland}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bookland}
      # Must be the URL clients actually reach the server on — it is published in the discovery
      # document and lands in the iss claim, and a mismatch only surfaces at validation time.
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-http://localhost:8080}
      # Base64 of the DER, single-line. The private half is the secret that used to be JWT_SECRET:
      # whoever holds it mints admin tokens.
      OAUTH2_JWK_PUBLIC_KEY: ${OAUTH2_JWK_PUBLIC_KEY}
      OAUTH2_JWK_PRIVATE_KEY: ${OAUTH2_JWK_PRIVATE_KEY}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-bookland-web}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_CLIENT_REDIRECT_URIS: ${OAUTH2_CLIENT_REDIRECT_URIS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STORAGE_COVERS_LOCATION: /var/bookland/covers
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - bookland-covers:/var/bookland/covers
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Single-node KRaft broker (no ZooKeeper): this one process is both broker and controller.
  # Same version as the Kafka client in Boot's BOM. No volume: topics and consumer offsets live in
  # the container, so they survive stop/start but not `docker compose down`.
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners, because a client must reach the broker at the address the broker
      # advertises: kafka:29092 inside the compose network, localhost:9092 for an app run from the host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # The internal topics default to 3 replicas, which a single broker cannot hold.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web UI for topics, messages and consumer-group offsets. Published on 8081: 8080 is the API.
  redpanda-console:
    image: redpandadata/console:v3.12.0
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bookland
      POSTGRES_USER: ${POSTGRES_USER:-bookland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookland}
    volumes:
      - bookland-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookland} -d bookland"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bookland-pgdata:
  bookland-covers:

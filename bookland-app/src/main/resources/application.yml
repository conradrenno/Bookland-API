spring:
  application:
    name: bookland
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  # docker-compose injects kafka:29092; the default reaches the compose broker from the host.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Wait for the broker to have the record before calling it sent (already the client default).
      acks: all
      properties:
        # How long send() may block waiting for the broker's metadata — i.e. how long a request
        # stalls when the broker is down. The client default is 60s.
        max.block.ms: 5000
    consumer:
      # A consumer group seen for the first time starts at the oldest record, not the newest:
      # events published before the group first joined are still applied.
      auto-offset-reset: earliest

# What the API needs to validate an access token. Read by ResourceServerConfig (bookland-web-support).
# The values are the Authorization Server's own, because in the monolith they are the same server.
# jwk-set-uri stays unset here: the keys are read in memory. A service in a process of its own sets
# it to <issuer>/oauth2/jwks.
bookland:
  resource-server:
    issuer: ${bookland.oauth2.issuer}
    audience: ${bookland.oauth2.api-audience}

# Common to every profile: without it the prod document lands on springdoc's default /v3/api-docs,
# which chain 3 does not cover, and the Authorize button runs without PKCE or Basic auth.
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      # The registered client requires PKCE. Without this the Authorize button starts a flow the
      # Authorization Server refuses, and the UI reports it as a generic authorization failure.
      # Note the nesting: the property lives under swagger-ui.oauth, and setting it one level up
      # is ignored silently — the value simply never reaches ui.initOAuth(...) in
      # /swagger-ui/swagger-initializer.js, which is where these settings land.
      use-pkce-with-authorization-code-grant: true
      # The registered client authenticates with client_secret_basic only. By default the UI sends
      # the id and secret in the form body (client_secret_post), which the token endpoint answers
      # with 401 invalid_client; this makes it send an Authorization: Basic header instead.
      use-basic-authentication-with-access-code-grant: true
      # Pre-fills the Authorize dialog. Not a secret: a client id is published by design.
      client-id: ${bookland.oauth2.client.client-id}
      # The client secret is deliberately NOT pre-filled. Our client is confidential
      # (client_secret_basic), so the UI must send it at the token step or the exchange answers
      # invalid_client — type `bookland-web-secret` into the Authorize dialog in dev, and the value of
      # OAUTH2_CLIENT_SECRET under the compose stack. Putting it
      # here would serve a secret inside swagger-initializer.js to every browser, and would be
      # copied into prod by whoever reads this file next. The cleaner fix, when a browser tool
      # needs this routinely, is a second registered client that is public (PKCE, no secret).

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:booklanddb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # O Flyway é o dono do schema em dev também, para que as migrations sejam
  # exercitadas a cada boot e não apenas em produção. O H2 roda em modo de
  # compatibilidade PostgreSQL para aceitar o mesmo SQL.
  flyway:
    enabled: true
    locations: classpath:db/migration

bookland:
  oauth2:
    # 127.0.0.1, not localhost: the redirect URIs below must be the loopback IP (RFC 8252), so the
    # browser half of the login lives on 127.0.0.1 — and the Swagger UI exchanges the code with a
    # fetch to the token URL built from this issuer. Under localhost that fetch is cross-origin,
    # the server sends no CORS headers, and the browser blocks it ("Failed to fetch").
    issuer: http://127.0.0.1:8080
    api-audience: bookland-api
    jwk:
      key-id: bookland-dev-key
      # Development key pair, committed on purpose: a throwaway identity for a local H2 database. Base64 of the DER — public in X.509, private
      # in PKCS#8 — single-line so the production values fit an environment variable.
      # Regenerate with:
      #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -outform DER -out k.der
      #   openssl pkcs8 -topk8 -nocrypt -inform DER -in k.der -outform DER -out private.der
      #   openssl rsa -in k.der -inform DER -pubout -outform DER -out public.der
      public-key: 
      private-key: 
    client:
      client-id: bookland-web
      client-secret: bookland-web-secret
      client-name: Bookland Web
      # Loopback IP, not "localhost" — the server rejects the literal hostname (RFC 8252).
      redirect-uris:
        - http://127.0.0.1:8080/authorized
        - http://127.0.0.1:8080/login/oauth2/code/bookland-web
        # Where the Swagger UI sends the browser back to. It reports this URL from the host the
        # page was loaded on, so the API document must be opened at 127.0.0.1 and not localhost —
        # the server rejects the literal hostname, and the redirect page talks to its opener
        # window, which would be cross-origin between the two names.
        - http://127.0.0.1:8080/swagger-ui/oauth2-redirect.html
      post-logout-redirect-uris:
        - http://127.0.0.1:8080/
      # Without "openid" the server issues no id_token at all.
      scopes:
        - openid
        - profile
        - email
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
  admin:
    email: admin@bookland.com
    password: admin1234
  storage:
    covers-location: ./bookland-data/covers

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookland}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  # O Flyway é o dono do schema; o validate acima só confere o mapeamento.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  h2:
    console:
      enabled: false

bookland:
  oauth2:
    # Must be the URL clients actually reach the server on: it is published in the discovery
    # document and lands in the iss claim, and a mismatch is only noticed at validation time.
    issuer: ${OAUTH2_ISSUER}
    api-audience: ${OAUTH2_API_AUDIENCE:bookland-api}
    jwk:
      key-id: ${OAUTH2_JWK_KEY_ID:bookland-key-1}
      public-key: ${OAUTH2_JWK_PUBLIC_KEY}
      # The secret of the whole system: whoever holds it mints admin tokens.
      private-key: ${OAUTH2_JWK_PRIVATE_KEY}
    client:
      client-id: ${OAUTH2_CLIENT_ID}
      client-secret: ${OAUTH2_CLIENT_SECRET}
      client-name: ${OAUTH2_CLIENT_NAME:Bookland Web}
      redirect-uris: ${OAUTH2_CLIENT_REDIRECT_URIS}
      post-logout-redirect-uris: ${OAUTH2_CLIENT_POST_LOGOUT_REDIRECT_URIS:}
      scopes: ${OAUTH2_CLIENT_SCOPES:openid,profile,email}
      access-token-ttl-minutes: ${OAUTH2_ACCESS_TOKEN_TTL_MINUTES:15}
      refresh-token-ttl-days: ${OAUTH2_REFRESH_TOKEN_TTL_DAYS:7}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  storage:
    covers-location: ${STORAGE_COVERS_LOCATION:/var/bookland/covers}

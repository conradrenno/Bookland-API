spring:
  application:
    name: bookland-notification
  profiles:
    active: dev
  # docker-compose injects kafka:29092; the default reaches the compose broker from the host.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Only the dead-letter recoverer produces here.
      acks: all
      properties:
        max.block.ms: 5000
    consumer:
      # A new group starts from the beginning of the topic: the first start of this service emails
      # about every order event Kafka still holds. Acceptable while the stack is a lab; a real
      # rollout would start this group at the end (latest) once.
      auto-offset-reset: earliest
      properties:
        # Only a topic's owner creates it (its NewTopic, with its partition count). Left on — the
        # client's default — a consumer that starts first creates someone else's topic with the
        # broker's default of 1 partition; the owner then raises it to 3, and the consumer keeps
        # reading partition 0 alone until its next metadata refresh (metadata.max.age.ms, 5 minutes
        # by default). Seen in step 6b: the notification service started first. Off, a consumer
        # waits for the topic to exist.
        allow.auto.create.topics: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # The compose broker's user (RABBITMQ_DEFAULT_USER). Not guest: the image lets guest connect
    # only from inside the container itself.
    username: ${RABBITMQ_USER:bookland}
    password: ${RABBITMQ_PASSWORD:bookland}
    # The channel counts what it publishes so the publisher can wait for the broker's ack
    # (RabbitEmailTaskQueueAdapter). Without it waitForConfirmsOrDie fails every publish.
    publisher-confirm-type: simple
    # The client default is 60 s: a broker that does not answer would hold the Kafka listener that long per try.
    connection-timeout: 5s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      # JavaMail waits forever by default — a mail server that accepts the connection and then
      # hangs would hold the RabbitMQ listener for good.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

bookland:
  notification:
    mail:
      from: ${MAIL_FROM:Bookland <no-reply@bookland.local>}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Its own in-memory database: the inbox. No H2 console — there is no web server to serve it.
    url: jdbc:h2:mem:notificationdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

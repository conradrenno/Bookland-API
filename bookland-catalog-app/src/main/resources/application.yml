spring:
  application:
    name: bookland-catalog
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  # docker-compose injects kafka:29092; the default reaches the compose broker from the host. The
  # catalog's consumer groups (bookland-catalog) keep the names they had in the monolith, so the
  # offsets committed there carry over.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        # How long send() may block waiting for the broker's metadata. The client default is 60s.
        max.block.ms: 5000
    consumer:
      auto-offset-reset: earliest
      properties:
        # Only a topic's owner creates it (its NewTopic, with its partition count). Left on — the
        # client's default — a consumer that starts first creates someone else's topic with the
        # broker's default of 1 partition; the owner then raises it to 3, and the consumer keeps
        # reading partition 0 alone until its next metadata refresh (metadata.max.age.ms, 5 minutes
        # by default). Seen in step 6b: the notification service started first. Off, a consumer
        # waits for the topic to exist.
        allow.auto.create.topics: false
  # Spring gRPC's security autoconfigurations are off, as in the monolith (see its application.yml):
  # no authentication between services yet, and OAuth2ResourceServerAutoConfiguration fails the
  # context on a Boot properties class this application does not have.
  autoconfigure:
    exclude:
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcSecurityAutoConfiguration
      - org.springframework.boot.grpc.server.autoconfigure.security.OAuth2ClientAutoConfiguration
      - org.springframework.boot.grpc.server.autoconfigure.security.OAuth2ResourceServerAutoConfiguration
  # gRPC: this service serves BookCatalog to the others, and asks orders (in the monolith) whether a
  # book has active orders before removing it. 9091 in dev because the monolith, on the same host,
  # holds 9090; in the compose stack each container has its own network, and the port is not
  # published to the host.
  grpc:
    server:
      port: ${GRPC_PORT:9091}
    client:
      channels:
        orders:
          address: ${ORDERS_GRPC_ADDRESS:static://localhost:9090}

server:
  # 8080 is the API (the monolith), 8081 the Redpanda Console, 9000 the identity service.
  port: ${SERVER_PORT:8082}

bookland:
  resource-server:
    audience: ${OAUTH2_API_AUDIENCE:bookland-api}
  openapi:
    title: Bookland Catalog API

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      # Same settings as the monolith's Swagger UI, for the same reasons: the client requires PKCE
      # and authenticates with client_secret_basic. The secret is typed into the dialog, never
      # pre-filled.
      use-pkce-with-authorization-code-grant: true
      use-basic-authentication-with-access-code-grant: true
      client-id: ${OAUTH2_CLIENT_ID:bookland-web}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Its own in-memory database: nothing of the catalog lives in the API's any more.
    url: jdbc:h2:mem:catalogdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      # Devtools turns this on; nothing here needs a session to survive a restart.
      persistent: false

bookland:
  resource-server:
    issuer: http://127.0.0.1:9000
    jwk-set-uri: http://127.0.0.1:9000/oauth2/jwks
  storage:
    covers-location: ./bookland-data/covers

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  h2:
    console:
      enabled: false

bookland:
  resource-server:
    issuer: ${OAUTH2_ISSUER}
    jwk-set-uri: ${OAUTH2_JWK_SET_URI}
  storage:
    covers-location: ${STORAGE_COVERS_LOCATION:/var/bookland/covers}
